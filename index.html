<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KNUH Derma">
  <title>경북대병원 피부과 임상 처방 & 항암 부작용 가이드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col antialiased select-none">

  <!-- TOP HEADER -->
  <header class="bg-blue-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="bg-white/20 p-1.5 rounded-lg">
          <i data-lucide="stethoscope" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight leading-none">경북대병원 피부과</h1>
          <p class="text-[11px] text-blue-100 mt-0.5">Clinical Decision Support Tool</p>
        </div>
      </div>
      <button onclick="openCurrentDrugInfo()" class="flex items-center space-x-1 text-xs bg-white/15 hover:bg-white/25 active:scale-95 px-2.5 py-1.5 rounded-lg font-semibold transition border border-white/20">
        <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
        <span>선택약제 정보</span>
      </button>
    </div>

    <!-- PROGRESS STEPPER BAR -->
    <div id="stepper-bar" class="bg-blue-800/60 border-t border-blue-600/50 px-4 py-2 text-xs hidden">
      <div class="max-w-xl mx-auto flex items-center justify-between font-medium">
        <div id="step-nav-1" onclick="goToStep(1)" class="flex items-center space-x-1.5 cursor-pointer text-blue-200 hover:text-white">
          <span class="w-5 h-5 rounded-full bg-blue-600 border border-blue-300 flex items-center justify-center text-[10px] font-bold">1</span>
          <span>프로그램 선택</span>
        </div>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-blue-300"></i>
        <div id="step-nav-2" onclick="goToStep(2)" class="flex items-center space-x-1.5 cursor-pointer text-white font-bold">
          <span class="w-5 h-5 rounded-full bg-white text-blue-800 flex items-center justify-center text-[10px] font-black">2</span>
          <span>평가/약제</span>
        </div>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-blue-400"></i>
        <div id="step-nav-3" class="flex items-center space-x-1.5 text-blue-300">
          <span class="w-5 h-5 rounded-full bg-blue-900/80 border border-blue-400/40 flex items-center justify-center text-[10px]">3</span>
          <span>처방/회신 가이드</span>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-start">

    <!-- DEPTH 1: 프로그램 선택 (Step 1) -->
    <div id="screen-step1" class="space-y-3.5 my-auto py-3">
      <div class="text-center space-y-1 mb-4">
        <span class="text-[11px] font-extrabold text-blue-600 uppercase tracking-wider bg-blue-50 px-3 py-1 rounded-full border border-blue-200">Clinical Protocol</span>
        <h2 class="text-xl font-black text-slate-800 tracking-tight">진료 프로그램을 선택하세요</h2>
        <p class="text-xs text-slate-500">외래 처방 계산 및 종양내과 항암 피부 부작용 협진 지원</p>
      </div>

      <!-- 소아 환자 -->
      <button onclick="selectPatientType('pediatric')" class="w-full text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-amber-500 shadow-xs active:scale-[0.99] transition-all group flex items-center justify-between">
        <div class="flex items-center space-x-3.5">
          <div class="w-12 h-12 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
            <i data-lucide="baby" class="w-6 h-6"></i>
          </div>
          <div>
            <div class="flex items-center space-x-1.5">
              <h3 class="text-base font-extrabold text-slate-900 group-hover:text-amber-600">소아 환자 약제 계산</h3>
              <span class="text-[9px] font-bold bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full border border-amber-200">Pediatric</span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">자디텐(케토티펜), 두드리진, 바난 등 체중(kg) 기반 시럽/정제 자동 환산</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:text-amber-600 shrink-0"></i>
      </button>

      <!-- 성인 장기기능 저하 -->
      <button onclick="selectPatientType('adult')" class="w-full text-left bg-white p-4 rounded-2xl border-2 border-slate-200 hover:border-blue-500 shadow-xs active:scale-[0.99] transition-all group flex items-center justify-between">
        <div class="flex items-center space-x-3.5">
          <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
            <i data-lucide="activity" class="w-6 h-6"></i>
          </div>
          <div>
            <div class="flex items-center space-x-1.5">
              <h3 class="text-base font-extrabold text-slate-900 group-hover:text-blue-600">성인 &middot; 신/간기능 저하</h3>
              <span class="text-[9px] font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full border border-blue-200">Renal / Hepatic</span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">Fexofenadine, Xyzal, Twolion, Remicut 등 항히스타민 11종 및 면역조절제</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:text-blue-600 shrink-0"></i>
      </button>

      <!-- 항암제 피부부작용 -->
      <button onclick="selectPatientType('onco')" class="w-full text-left bg-white p-4 rounded-2xl border-2 border-rose-200 hover:border-rose-500 shadow-sm active:scale-[0.99] transition-all group flex items-center justify-between bg-gradient-to-r from-white to-rose-50/40">
        <div class="flex items-center space-x-3.5">
          <div class="w-12 h-12 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
            <i data-lucide="shield-alert" class="w-6 h-6"></i>
          </div>
          <div>
            <div class="flex items-center space-x-1.5">
              <h3 class="text-base font-extrabold text-slate-900 group-hover:text-rose-600">항암제 유발 피부부작용 (CIAE)</h3>
              <span class="text-[9px] font-black bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full border border-rose-200">Onco-Derm</span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">EGFRi, ICI(면역항암제), TKI 수족증후군 CTCAE v5.0 평가 및 회신 템플릿</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-rose-500 shrink-0"></i>
      </button>
    </div>

    <!-- DEPTH 2: 세부 파라미터 및 약제 선택 (Step 2) -->
    <div id="screen-step2" class="space-y-3.5 hidden flex-1 flex flex-col">
      <div class="flex items-center justify-between">
        <button onclick="goToStep(1)" class="flex items-center space-x-1 text-xs font-bold text-slate-600 hover:text-slate-900 bg-white px-3 py-1.5 rounded-lg border border-slate-200 active:scale-95 transition">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>프로그램 재선택</span>
        </button>
        <span id="step2-badge" class="text-xs font-extrabold px-2.5 py-1 rounded-full"></span>
      </div>

      <!-- 소아 파라미터 박스 -->
      <div id="pediatric-params-box" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3 hidden">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] font-bold text-slate-600">체중 (Weight)</label>
            <div class="relative mt-1">
              <input type="number" id="input-weight" value="12" step="0.5" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-3 py-2 text-base font-extrabold text-slate-900 focus:outline-none focus:border-blue-500 focus:bg-white">
              <span class="absolute right-3 top-2.5 text-xs font-bold text-slate-400">kg</span>
            </div>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-600">나이 (Age)</label>
            <div class="relative mt-1">
              <input type="number" id="input-age" value="2" min="0" max="18" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-3 py-2 text-base font-extrabold text-slate-900 focus:outline-none focus:border-blue-500 focus:bg-white">
              <span class="absolute right-3 top-2.5 text-xs font-bold text-slate-400">세</span>
            </div>
          </div>
        </div>

        <!-- 제형 필터 세그먼트 -->
        <div class="pt-2 border-t border-slate-100">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[11px] font-bold text-slate-700">제형 필터링</span>
            <span id="form-filter-desc" class="text-[10px] text-blue-600 font-bold">모든 제형 표시 중</span>
          </div>
          <div class="grid grid-cols-3 gap-1.5 bg-slate-100 p-1 rounded-xl text-xs font-bold">
            <button type="button" id="form-btn-all" onclick="setFormFilter('all')" class="py-1.5 rounded-lg bg-white text-blue-700 shadow-xs">전체</button>
            <button type="button" id="form-btn-syrup" onclick="setFormFilter('syrup')" class="py-1.5 rounded-lg text-slate-600 hover:text-slate-900">시럽제만 (mL)</button>
            <button type="button" id="form-btn-tablet" onclick="setFormFilter('tablet')" class="py-1.5 rounded-lg text-slate-600 hover:text-slate-900">정제만 (T)</button>
          </div>
        </div>
      </div>

      <!-- 성인 장기기능 파라미터 박스 -->
      <div id="adult-params-box" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3 hidden">
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-[11px] font-bold text-slate-600">신기능 저하 정도 (eGFR / CrCl 기준)</label>
            <span class="text-[10px] text-slate-400">mL/min</span>
          </div>
          <div class="grid grid-cols-4 gap-1">
            <button type="button" onclick="setRenalFilter('normal', this)" class="renal-btn py-1.5 px-1 text-center text-xs font-bold rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-700">≥50 (정상)</button>
            <button type="button" onclick="setRenalFilter('moderate', this)" class="renal-btn py-1.5 px-1 text-center text-xs font-bold rounded-lg border-2 border-slate-200 bg-white text-slate-700">30~49 (중등도)</button>
            <button type="button" onclick="setRenalFilter('severe', this)" class="renal-btn py-1.5 px-1 text-center text-xs font-bold rounded-lg border-2 border-slate-200 bg-white text-slate-700">10~29 (중증)</button>
            <button type="button" onclick="setRenalFilter('esrd', this)" class="renal-btn py-1.5 px-1 text-center text-xs font-bold rounded-lg border-2 border-slate-200 bg-white text-slate-700">&lt;10/HD</button>
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">간기능 저하 (Child-Pugh Class)</label>
          <div class="grid grid-cols-3 gap-1">
            <button type="button" onclick="setHepaticFilter('normal', this)" class="hepatic-btn py-1.5 text-center text-xs font-bold rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-700">정상 (Normal)</button>
            <button type="button" onclick="setHepaticFilter('mild-mod', this)" class="hepatic-btn py-1.5 text-center text-xs font-bold rounded-lg border-2 border-slate-200 bg-white text-slate-700">Class A/B (경/중등도)</button>
            <button type="button" onclick="setHepaticFilter('severe', this)" class="hepatic-btn py-1.5 text-center text-xs font-bold rounded-lg border-2 border-slate-200 bg-white text-slate-700">Class C (중증)</button>
          </div>
        </div>
      </div>

      <!-- 항암제 파라미터 박스 -->
      <div id="onco-params-box" class="bg-white rounded-2xl p-4 shadow-sm border border-rose-200 space-y-3 hidden">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] font-bold text-slate-600">체표면적 침범 (BSA %)</label>
            <select id="onco-bsa" class="w-full mt-1 bg-slate-50 border border-slate-300 rounded-xl p-2 text-xs font-bold" onchange="renderDrugCardList()">
              <option value="mild">&lt; 10% BSA (경미한 국소 침범)</option>
              <option value="moderate" selected>10 ~ 30% BSA (중등도 침범)</option>
              <option value="severe">&gt; 30% BSA (광범위 전신 침범)</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-600">일상생활 제한도 (ADL)</label>
            <select id="onco-adl" class="w-full mt-1 bg-slate-50 border border-slate-300 rounded-xl p-2 text-xs font-bold" onchange="renderDrugCardList()">
              <option value="none">증상 미미 / 일상 제한 없음</option>
              <option value="instrumental" selected>기구적 일상 제한 (조리 등)</option>
              <option value="selfcare">자가간호 제한 (세면 등 불가)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 약제 검색 및 리스트 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3 flex-1 flex flex-col">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
          <input type="text" id="drug-search-input" placeholder="약제명 검색 (예: Fexofenadine, Xyzal, Twolion, 자디텐...)" class="w-full pl-9 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white" oninput="filterDrugList()">
          <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex space-x-1.5 overflow-x-auto no-scrollbar pb-1 text-xs" id="category-tabs"></div>
        <div id="drug-card-list" class="space-y-2 overflow-y-auto max-h-[260px] pr-1 flex-1"></div>

        <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs text-slate-500">
          <span id="drug-count-badge" class="font-bold text-slate-600"></span>
          <button onclick="openCurrentDrugInfo()" class="text-blue-600 font-bold hover:underline flex items-center space-x-1">
            <i data-lucide="info" class="w-3.5 h-3.5"></i>
            <span>선택 약제 상세 사전</span>
          </button>
        </div>
      </div>

      <div class="pt-1 safe-bottom">
        <button id="btn-to-step3" onclick="goToStep(3)" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-extrabold py-3.5 px-4 rounded-xl shadow-md flex items-center justify-center space-x-2 transition">
          <span id="step3-btn-label">처방 가이드 및 평가 확인</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- DEPTH 3: 최종 처방 / 회신 가이드 (Step 3) -->
    <div id="screen-step3" class="space-y-3.5 hidden flex-1 flex flex-col">
      <div class="flex items-center justify-between">
        <button onclick="goToStep(2)" class="flex items-center space-x-1 text-xs font-bold text-slate-600 hover:text-slate-900 bg-white px-3 py-1.5 rounded-lg border border-slate-200 active:scale-95 transition">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>수정하기 (Step 2)</span>
        </button>
        <div class="flex items-center space-x-1.5" id="step3-external-links"></div>
      </div>

      <div id="step3-content" class="space-y-3 flex-1 overflow-y-auto pr-1"></div>

      <div class="space-y-2 pt-2 safe-bottom">
        <button onclick="copyEmrText()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-black py-3 px-4 rounded-xl shadow-md flex items-center justify-center space-x-2 transition">
          <i data-lucide="clipboard-copy" class="w-4 h-4"></i>
          <span id="copy-btn-text">원내 EMR 차팅 문구 복사</span>
        </button>
        <button onclick="goToStep(1)" class="w-full bg-slate-200 hover:bg-slate-300 active:scale-[0.99] text-slate-700 font-bold py-2 px-4 rounded-xl text-xs flex items-center justify-center space-x-1.5 transition">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span>처음으로 (새 환자 진료)</span>
        </button>
      </div>
    </div>

  </main>

  <!-- IN-APP DRUG MONOGRAPH MODAL -->
  <div id="in-app-drug-modal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-3 hidden backdrop-blur-xs">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[88vh]">
      <div class="bg-blue-700 text-white px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2">
          <i data-lucide="book-open" class="w-5 h-5 text-blue-200"></i>
          <div>
            <h3 id="modal-drug-title" class="font-black text-sm leading-tight">약제 상세 정보</h3>
            <p id="modal-drug-subtitle" class="text-[10px] text-blue-200 mt-0.5">약학정보원(KPIC) & 원내 의약품 사전</p>
          </div>
        </div>
        <button onclick="closeInAppDrugModal()" class="text-white/80 hover:text-white p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="modal-drug-body" class="p-4 overflow-y-auto space-y-3 text-xs flex-1"></div>

      <div class="p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between shrink-0">
        <span class="text-[10px] text-slate-400">외부 공식 원문 열람:</span>
        <div class="flex space-x-1.5" id="modal-external-actions"></div>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2.5 rounded-full text-xs font-bold shadow-lg z-50 flex items-center space-x-2 transition-all opacity-0 pointer-events-none translate-y-2">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-msg"></span>
  </div>

  <script>
    // 1. 소아 약제 DB (자디텐/케토티펜 전면 추가)
    const PEDIATRIC_DRUGS = [
      {
        id: "p_zaditen",
        name: "자디텐 (케토티펜 0.2mg/mL 시럽 & 1mg 정)",
        category: "antihistamine",
        forms: ["syrup", "tablet"],
        doseType: "fixed_age",
        rules: [
          { maxAge: 0.5, note: "6개월 미만 안전성 미확립 (투여 비권장)" },
          { minAge: 0.5, maxAge: 3, dose: 0.5, freq: "1일 2회 (회당 0.5mg, 아침/저녁)", syrupMl: 2.5 },
          { minAge: 3, maxAge: 99, dose: 1.0, freq: "1일 2회 (회당 1.0mg, 아침/저녁)", syrupMl: 5.0 }
        ],

        <button onclick="setCategory('${t.id}')" class="px-3 py-1.5 rounded-lg whitespace-nowrap font-bold text-xs transition ${currentCategory === t.id ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          ${t.label}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryTabs();
      renderDrugCardList();
    }

    function filterDrugList() {
      searchQuery = document.getElementById('drug-search-input').value.trim().toLowerCase();
      document.getElementById('clear-search-btn').classList.toggle('hidden', searchQuery.length === 0);
      renderDrugCardList();
    }

    function clearSearch() {
      document.getElementById('drug-search-input').value = '';
      searchQuery = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderDrugCardList();
    }

    function renderDrugCardList() {
      const container = document.getElementById('drug-card-list');
      let all = (patientType === 'pediatric') ? PEDIATRIC_DRUGS : ((patientType === 'adult') ? ADULT_DRUGS : ONCO_DRUGS);

      if (patientType === 'onco') {
        all = [...all].sort((a, b) => b.riskScore - a.riskScore);
      }

      const filtered = all.filter(d => {
        const matchesCat = (currentCategory === 'all') || (d.category === currentCategory);
        const matchesSearch = !searchQuery || d.name.toLowerCase().includes(searchQuery) || d.searchKey.toLowerCase().includes(searchQuery);
        
        let matchesForm = true;
        if (patientType === 'pediatric') {
          if (currentFormFilter === 'syrup') matchesForm = d.forms && d.forms.includes('syrup');
          else if (currentFormFilter === 'tablet') matchesForm = d.forms && d.forms.includes('tablet');
        }
        return matchesCat && matchesSearch && matchesForm;
      });

      const filterDescText = currentFormFilter === 'syrup' ? ' [시럽제만]' : (currentFormFilter === 'tablet' ? ' [정제만]' : '');
      document.getElementById('drug-count-badge').innerText = `총 ${filtered.length}개 약제 노출 중${filterDescText}`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-xs">
            <p class="font-bold text-slate-600">조건에 해당하는 약제가 없습니다.</p>
            <p class="text-[11px] mt-1">제형 필터(시럽/정제)를 [전체]로 변경해보세요.</p>
            <button onclick="setFormFilter('all')" class="mt-2 text-xs font-bold text-blue-600 hover:underline">
              제형 필터 전체 해제 &rarr;
            </button>
          </div>
        `;
        return;
      }

      if (!filtered.some(d => d.id === selectedDrugId) && filtered.length > 0) {
        selectedDrugId = filtered[0].id;
      }

      container.innerHTML = filtered.map(d => {
        const isSelected = (d.id === selectedDrugId);
        const hasSyrup = d.forms && d.forms.includes('syrup');
        const hasTablet = d.forms && d.forms.includes('tablet');

        return `
          <div onclick="selectDrug('${d.id}')" class="p-3 rounded-xl border-2 cursor-pointer transition-all flex items-center justify-between ${isSelected ? 'border-blue-600 bg-blue-50/70 shadow-xs' : 'border-slate-200 bg-white hover:border-slate-300'}">
            <div class="space-y-1 flex-1 pr-2">
              <div class="flex items-center space-x-1.5 flex-wrap">
                <span class="font-extrabold text-xs ${isSelected ? 'text-blue-900' : 'text-slate-800'}">${d.name}</span>
                <div class="flex items-center space-x-1">
                  ${hasSyrup ? '<span class="text-[9px] font-black bg-amber-100 text-amber-800 px-1.5 py-0.2 rounded border border-amber-200">시럽</span>' : ''}
                  ${hasTablet ? '<span class="text-[9px] font-black bg-blue-100 text-blue-800 px-1.5 py-0.2 rounded border border-blue-200">정제</span>' : ''}
                  ${d.riskScore ? `<span class="text-[9px] font-black px-1.5 py-0.2 rounded border ${d.riskScore >= 90 ? 'bg-rose-100 text-rose-700 border-rose-200' : 'bg-amber-100 text-amber-700 border-amber-200'}">위험 ${d.riskScore}</span>` : ''}
                </div>
              </div>
              <p class="text-[11px] text-slate-500 line-clamp-1">
                ${patientType === 'adult' ? `[감량 기준] ${d.pearls}` : (patientType === 'onco' ? `[발생시기: ${d.onsetLatency}] ${d.primaryEruption}` : (d.precautions || ''))}
              </p>
            </div>
            <div class="flex items-center space-x-1.5 shrink-0">
              <button type="button" onclick="openDrugModalById('${d.id}'); event.stopPropagation();" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg" title="상세 사전">
                <i data-lucide="book-open" class="w-4 h-4"></i>
              </button>
              <div class="w-5 h-5 rounded-full border flex items-center justify-center ${isSelected ? 'border-blue-600 bg-blue-600 text-white' : 'border-slate-300 bg-white'}">
                ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function selectDrug(id) {
      selectedDrugId = id;
      renderDrugCardList();
    }

    function calculateCtcaeGrade() {
      const bsa = document.getElementById('onco-bsa').value;
      const adl = document.getElementById('onco-adl').value;
      if (bsa === 'severe' || adl === 'selfcare') {
        return { grade: 3, label: "Grade 3 (중증 / 항암제 일시중단 권고)", color: "text-rose-700 bg-rose-100 border-rose-300" };
      }
      if (bsa === 'moderate' || adl === 'instrumental') {
        return { grade: 2, label: "Grade 2 (중등도 / 치료 개입 필요)", color: "text-amber-800 bg-amber-100 border-amber-300" };
      }
      return { grade: 1, label: "Grade 1 (경증 / 항암제 지속 투여)", color: "text-emerald-800 bg-emerald-100 border-emerald-300" };
    }

 - ${rule.action}

 - ${rule.chemo}
6. 권고사항: 1주 후 또는 증상 변화 시 피부과 외래 재평가 요망.`;

        container.innerHTML = `
          <div class="p-4 rounded-2xl border-2 ${ctcae.color} space-y-2">

              <span class="text-[10px] font-black uppercase">CTCAE v5.0 산정 결과</span>

              </div>
              <p class="text-xs text-slate-600">${drug.precautions}</p>

    function copyEmrText() {
      navigator.clipboard.writeText(lastGeneratedEmrText).then(() => {
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = "의무기록 회신 문구가 복사되었습니다.";
        toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
        setTimeout(() => toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none'), 2000);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      goToStep(1);
    });
  </script>
</body>
</html>
